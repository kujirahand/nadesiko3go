<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>なでしこ3 (gonako-gui)</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <!-- ツールバー -->
    <header class="toolbar">
      <div class="toolbar-brand">
        <span class="logo">🌸</span>
        <span class="title">なでしこ3 GUI</span>
      </div>
      <div class="toolbar-actions">
        <button id="btn-run" class="btn btn-primary" title="プログラムを実行 (Ctrl+R / Cmd+R)">
          <span class="icon">▶</span> 実行
        </button>
        <button id="btn-save" class="btn btn-secondary" title="現在のファイルを上書き保存 (Ctrl+S / Cmd+S)">
          <span class="icon">💾</span> 保存
        </button>
        <div class="separator"></div>
        <div class="app-type-group">
          <label for="select-app-type" class="label-app-type">種類:</label>
          <select id="select-app-type" class="select-app-type" title="実行するアプリの種類を選択">
            <option value="cli" selected>コマンドライン</option>
            <option value="window">ウィンドウ</option>
          </select>
        </div>
        <div class="separator"></div>
        <span id="exec-status" class="status-indicator">待機中</span>
      </div>
    </header>

    <!-- メインワークスペース -->
    <main class="workspace">
      <!-- 左ペイン: ツールタブ (命令 / ひな形 / ファイル) -->
      <aside class="sidebar" id="sidebar">
        <!-- タブ切り替えボタン -->
        <div class="sidebar-tabs">
          <button id="tab-btn-cmd" class="tab-btn active">📖 命令</button>
          <button id="tab-btn-template" class="tab-btn">📄 ひな形</button>
          <button id="tab-btn-file" class="tab-btn">📁 ファイル</button>
        </div>

        <!-- 命令タブコンテンツ -->
        <div id="tab-content-cmd" class="tab-content active">
          <div class="search-box-wrapper">
            <input id="cmd-search" type="text" class="search-input" placeholder="命令を検索... (例: 表示, 文字, 配列)" />
            <span id="cmd-count" class="badge">0件</span>
          </div>
          <div id="cmd-list" class="list-container cmd-list">
            <!-- JavaScriptで動的生成 -->
          </div>
        </div>

        <!-- ひな形タブコンテンツ -->
        <div id="tab-content-template" class="tab-content">
          <div class="search-box-wrapper">
            <input id="template-search" type="text" class="search-input" placeholder="ひな形を検索..." />
            <span id="template-count" class="badge">0件</span>
          </div>
          <div id="template-list" class="list-container template-list">
            <!-- JavaScriptで動的生成 -->
          </div>
        </div>

        <!-- ファイルタブコンテンツ -->
        <div id="tab-content-file" class="tab-content">
          <div class="file-nav-bar">
            <button id="btn-file-up" class="btn-icon" title="上のフォルダへ">⬆</button>
            <button id="btn-file-home" class="btn-icon" title="ホームフォルダへ">🏠</button>
            <span id="current-dir-display" class="current-dir-text" title="現在のフォルダ">~/</span>
          </div>
          <div id="file-list" class="list-container file-list">
            <!-- JavaScriptで動的生成 -->
          </div>
        </div>
      </aside>

      <!-- 垂直スプリッター (左サイドバー / 右エディタ領域) -->
      <div class="splitter-v" id="splitter-v"></div>

      <!-- 右ペイン (上: エディタ / 下: 実行結果) -->
      <div class="main-pane">
        <!-- 上部: エディタ -->
        <section class="pane pane-editor">
          <div class="pane-header">
            <div class="pane-header-left">
              <span class="pane-title">エディタ</span>
              <span id="active-file-name" class="file-badge">新規プログラム.nako3</span>
            </div>
            <div class="editor-tools">
              <span id="char-count" class="badge">0 文字</span>
            </div>
          </div>
          <div class="editor-wrapper">
            <div id="line-numbers" class="line-numbers">1</div>
            <textarea id="editor" class="editor" spellcheck="false" placeholder="ここに なでしこ3 のプログラムを入力してください..."></textarea>
          </div>
        </section>

        <!-- 水平スプリッター (エディタ / 実行結果) -->
        <div class="splitter-h" id="splitter-h"></div>

        <!-- 下部: 実行結果 (コンソール) -->
        <section class="pane pane-output" id="pane-output">
          <div class="pane-header">
            <div class="pane-header-left">
              <span class="pane-title">実行結果</span>
              <span id="mode-badge" class="mode-badge">コマンドライン</span>
            </div>
            <div class="output-actions">
              <button id="btn-clear-log" class="btn-sm" title="実行結果を消去">🗑 ログ消去</button>
              <button id="btn-copy-log" class="btn-sm" title="実行結果をコピー">📋 コピー</button>
            </div>
          </div>
          <div class="output-wrapper">
            <!-- ウィンドウアプリ用のプレビュー領域 -->
            <div id="window-preview" class="window-preview-area" style="display: none;"></div>
            <!-- コンソールテキスト出力 -->
            <pre id="output" class="output">ここに実行結果が表示されます。</pre>
          </div>
        </section>
      </div>
    </main>

    <!-- フッターステータスバー -->
    <footer class="statusbar">
      <div class="status-left">
        <span id="cursor-pos">行: 1, 列: 1</span>
        <span class="status-sep">|</span>
        <span id="status-msg">準備完了</span>
      </div>
      <div class="status-right">
        <span id="version-info">gonako-gui</span>
      </div>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
